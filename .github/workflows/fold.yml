name: Fold Penalti APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'FoldPenalti/**'
      - '.github/workflows/fold.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # haftada bir: imza anahtarinin cache'i silinmesin

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Her CI calistirmasi yeni bir debug anahtari uretir ve telefon "Yuklenmedi" der.
      # Anahtari cache'te tutarak butun derlemelerin ayni imzayi tasimasini sagliyoruz.
      - name: Imza anahtarini cache'ten al
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fold-debug-keystore-v1

      - name: Anahtar yoksa olustur
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Yeni anahtar uretildi"
          else
            echo "Cache'teki anahtar kullaniliyor"
          fi

      - name: Debug APK derle
        working-directory: FoldPenalti
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FoldPenalti.apk

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: FoldPenalti-apk
          path: FoldPenalti/FoldPenalti.apk
          if-no-files-found: error

      - name: Release yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fold-latest
          name: Fold Penalti (APK)
          body: "Telefondan kur: FoldPenalti.apk dosyasina dokun. Flex modu icin telefonu yarim kapat."
          files: FoldPenalti/FoldPenalti.apk
